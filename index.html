<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f0f4f8; margin: 0; color: #1f2937; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  #lock { width: 100%; max-width: 340px; background: #fff; border-radius: 14px; padding: 26px 22px 20px; box-shadow: 0 4px 16px rgba(0,0,0,.08); opacity: 0; transition: opacity .25s; }
  .lock-icon { font-size: 40px; text-align: center; margin-bottom: 6px; }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #6b7280; text-align: center; margin-bottom: 18px; }
  input { width: 100%; font-size: 16px; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; background: #fafafa; }
  input:focus { outline: 2px solid #2563eb; border-color: transparent; }
  button { width: 100%; margin-top: 12px; font-size: 15px; padding: 13px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  #err { display: none; font-size: 13px; color: #dc2626; text-align: center; margin-top: 10px; }
  .note { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 14px; line-height: 1.5; }
</style>
</head>

  <h1>私人工具</h1>
  <div class="sub">请输入访问密码</div>
  <form id="lockForm">
    <input id="pw" type="password" autocomplete="off" enterkeyhint="go" placeholder="访问密码">
    <button id="btn" type="submit">解 锁</button>
    <div id="err">密码不对，再试一次</div>
  </form>
  <div class="note">密码只在本机验证，不会上传<br>解锁过一次后本机自动记住</div>
</div>

  var LS_KEY = 'utk-v1';
  var enc = new TextEncoder();

  function b64d(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function b64e(u8) {
    var s = '';
    for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  }
  function deriveKey(pw) {
    return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64d(SALT), iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function tryUnlock(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(IV) }, key, b64d(DATA))
      .then(function (buf) {
        document.open();
        document.write(new TextDecoder().decode(buf));
        document.close();
        return true;
      })
      .catch(function () { return false; });
  }

  var lock = document.getElementById('lock');
  var form = document.getElementById('lockForm');
  var pwInput = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');

  // 本机已记住 → 自动解锁
  (function () {
    var saved = localStorage.getItem(LS_KEY);
    if (!saved) { lock.style.opacity = '1'; return; }
    crypto.subtle.importKey('raw', b64d(saved), 'AES-GCM', true, ['decrypt'])
      .then(function (key) { return tryUnlock(key); })
      .then(function (ok) {
        if (!ok) { localStorage.removeItem(LS_KEY); lock.style.opacity = '1'; }
      })
      .catch(function () { localStorage.removeItem(LS_KEY); lock.style.opacity = '1'; });
  })();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = pwInput.value;
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = '解锁中…';
    err.style.display = 'none';
    deriveKey(pw).then(function (key) {
      return tryUnlock(key).then(function (ok) {
        if (ok) {
          crypto.subtle.exportKey('raw', key).then(function (raw) {
            try { localStorage.setItem(LS_KEY, b64e(new Uint8Array(raw))); } catch (e2) {}
          }).catch(function () {});
        } else {
          btn.disabled = false;
          btn.textContent = '解 锁';
          err.style.display = 'block';
          pwInput.select();
        }
      });
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = '解 锁';
      err.style.display = 'block';
    });
  });
})();
